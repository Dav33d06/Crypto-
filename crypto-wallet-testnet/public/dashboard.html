<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home — NovaWallet</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#060915" />
<meta name="robots" content="noindex" />
</head>
<body>
  <div class="nav glass">
    <a href="/dashboard.html" class="brand" style="text-decoration:none;color:inherit;"><div class="brand-logo">₮</div><span>Nova<span class="brand-accent">Wallet</span></span></a>
    <div class="nav-links"></div>
  </div>

  <div class="container">
    <div id="banner-slot"></div>
    <div id="onboarding"></div>

    <h2>Home</h2>

    <div class="card">
      <h3>Total balance</h3>
      <div class="balance" id="total" style="font-size: 42px;">$0.00</div>
    </div>

    <div class="grid grid-3">
      <div class="card"><h3>Realized PnL</h3><div class="balance" id="pnl-realized" style="font-size: 22px;">$0.00</div></div>
      <div class="card"><h3>Unrealized PnL</h3><div class="balance" id="pnl-unrealized" style="font-size: 22px;">$0.00</div></div>
      <div class="card"><h3>Total PnL</h3><div class="balance" id="pnl-total" style="font-size: 22px;">$0.00</div></div>
    </div>

    <div class="card">
      <h3>Last 30 days</h3>
      <svg id="chart" style="width:100%; height: 240px; display:block;"></svg>
    </div>

    <h3 style="margin-top: 24px; margin-bottom: 12px;">Holdings</h3>
    <div class="grid grid-3" id="holdings"></div>

    <div class="grid grid-2" style="margin-top: 18px;">
      <div class="card">
        <h3>Quick Actions</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;">
          <a class="btn" href="/wallet.html">Deposit</a>
          <a class="btn secondary" href="/wallet.html">Withdraw</a>
          <a class="btn secondary" href="/orders.html">Trade</a>
          <a class="btn secondary" href="/orders.html#convert">Convert</a>
          <a class="btn secondary" href="/earn.html#staking">Stake USDT</a>
          <a class="btn secondary" href="/earn.html#copy">Copy trading</a>
        </div>
      </div>
      <div class="card">
        <h3>Account Status</h3>
        <div class="row"><div class="row-label">KYC level</div><div id="kyc-status" class="row-sub">Loading…</div></div>
        <div class="row"><div class="row-label">2FA</div><div id="twofa-status" class="row-sub">Loading…</div></div>
        <div class="row"><div class="row-label">Member since</div><div id="member-since" class="row-sub">—</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Open Positions</h3>
      <div id="positions"></div>
    </div>

    <div class="card">
      <h3>Recent Activity</h3>
      <div id="txs">
        <div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div><div class="skeleton skeleton-row"></div>
      </div>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/prices.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/portfolio.js"></script>
  <script src="/js/footer.js"></script>
</body>
</html>
